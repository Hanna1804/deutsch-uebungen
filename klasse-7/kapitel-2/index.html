<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wortschatz: Kapitel 2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --panel:#FAFAFA;
  --ink:#111827;
  --muted:#6B7280;
  --line:#EAEAEA;
  --line-strong:#D1D5DB;
  --blue:#2563EB;
  --blue-soft:#EFF6FF;
  --red:#DC2626;
  --red-soft:#FEF2F2;
  --green:#059669;
  --green-soft:#ECFDF5;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.08);
  --r:16px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
header,nav,.filters,main,footer{max-width:960px;margin:0 auto;padding-left:24px;padding-right:24px}
header{padding-top:calc(40px + env(safe-area-inset-top,0px));padding-bottom:8px}
h1{margin:0;font-size:clamp(28px,4.5vw,40px);line-height:1.15;font-weight:800;letter-spacing:-.02em}
.lead{margin:8px 0 0;color:var(--muted);font-size:17px}
nav{
  padding-top:28px;padding-bottom:0;display:flex;flex-wrap:wrap;gap:4px;
  border-bottom:1px solid var(--line);
}
.stamp{
  border:0;background:none;cursor:pointer;font:inherit;
  font-weight:600;font-size:15px;color:var(--muted);
  padding:10px 14px;position:relative;border-radius:0;
  transition:color .15s;
}
.stamp span{display:block;white-space:nowrap}
.stamp:hover{color:var(--ink)}
.stamp[aria-selected="true"]{color:var(--blue);font-weight:700}
.stamp[aria-selected="true"]::after{
  content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
  background:var(--blue);border-radius:2px 2px 0 0;
}
.stamp:focus-visible,.cat:focus-visible,.btn:focus-visible,.say:focus-visible,.ex:focus-visible,.fc:focus-visible,.segb:focus-visible,#q:focus-visible,#voice:focus-visible,.psegb:focus-visible,.sp-sum:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;
}

.filters{padding-top:20px;padding-bottom:4px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cat{
  font:inherit;font-weight:500;font-size:14px;
  border:1px solid var(--line-strong);background:#fff;color:var(--ink);
  border-radius:999px;padding:7px 14px;min-height:38px;cursor:pointer;
  transition:all .15s;
}
.cat:hover{border-color:var(--ink)}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.voice{font-weight:500;font-size:14px;color:var(--muted)}
.voice summary{cursor:pointer;min-height:38px;display:flex;align-items:center;padding:0 4px;list-style:none}
.voice summary::-webkit-details-marker{display:none}
.voice summary::after{content:"▾";margin-left:6px;font-size:12px}
.voice select,#voice{
  font:inherit;font-size:14px;max-width:240px;padding:8px 10px;
  border:1px solid var(--line-strong);border-radius:10px;background:#fff;color:var(--ink);
  min-height:40px;margin-top:4px;
}
.msg{max-width:960px;margin:0 auto;padding:0 24px;font-weight:500;font-size:14px;min-height:0}
.msg.warn{color:var(--red);padding-top:8px}
main{padding-top:24px;padding-bottom:64px}
.panel{display:none}
.panel.active{display:block}
.btn{
  font:inherit;font-weight:600;font-size:15px;
  border:1px solid var(--line-strong);background:#fff;color:var(--ink);
  border-radius:10px;padding:10px 18px;cursor:pointer;min-height:44px;
  transition:all .15s;
}
.btn:hover:not([disabled]){border-color:var(--ink);background:var(--panel)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.main{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.main:hover:not([disabled]){background:#000;border-color:#000}
.hint{color:var(--muted);font-size:15px}

/* Dictionary */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin:4px 0 8px}
#q{
  font:inherit;font-size:16px;flex:1 1 240px;max-width:420px;
  border:1px solid var(--line-strong);border-radius:10px;padding:11px 14px;min-height:46px;
  background:#fff;color:var(--ink);transition:border-color .15s;
}
#q:focus{border-color:var(--blue);outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grp h3{
  margin:36px 0 12px;font-size:15px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
.grp h3 .n{
  font-size:12px;font-weight:600;background:var(--panel);color:var(--muted);
  border-radius:999px;padding:2px 9px;letter-spacing:0;text-transform:none;
}
.entries{list-style:none;margin:0;padding:0;column-count:1;column-gap:40px}
@media (min-width:860px){.entries{column-count:2}}
.entry{
  display:flex;gap:12px;align-items:flex-start;
  padding:14px 0;border-bottom:1px solid var(--line);break-inside:avoid;
}
.say{
  flex:none;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line-strong);background:#fff;color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .15s;
}
.say:hover{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.body{min-width:0}
.line{font-size:18px;line-height:1.35}
.w{font-weight:600}
.art{
  display:inline-block;padding:0 8px;border-radius:6px;
  font-weight:600;font-size:.78em;margin-right:4px;line-height:1.5;
}
.art.der{color:#1E40AF;background:#DBEAFE}
.art.die{color:#B91C1C;background:#FEE2E2}
.art.das{color:#047857;background:#D1FAE5}
.tag{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;
  color:var(--muted);background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:1px 7px;vertical-align:middle;margin-left:8px;text-transform:uppercase;
}
.forms{color:var(--muted);font-size:14px;margin-top:2px}
.ru{font-size:15px;color:var(--muted);margin-top:2px}
.ex{
  display:block;font:inherit;font-size:14px;font-style:italic;color:var(--muted);
  background:none;border:0;padding:6px 0 0;text-align:left;cursor:pointer;min-height:36px;
  transition:color .15s;
}
.ex:hover{color:var(--blue)}

/* Cards */
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:4px 0 16px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:#fff}
.segb{
  font:inherit;font-weight:500;font-size:14px;border:0;background:#fff;color:var(--ink);
  padding:10px 14px;min-height:42px;cursor:pointer;transition:all .15s;
}
.segb+.segb{border-left:1px solid var(--line-strong)}
.segb[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;min-height:42px;color:var(--muted);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
.prog{display:flex;align-items:center;gap:14px;margin:4px 0 20px}
.bar{flex:1;height:8px;border-radius:999px;background:var(--panel);overflow:hidden;border:1px solid var(--line)}
.bar span{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
#ptxt{font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.stage{perspective:1100px;max-width:560px;margin:0 auto}
.fc{
  display:grid;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;
  border-radius:var(--r);-webkit-tap-highlight-color:transparent;
}
.fc.flip{transform:rotateY(180deg)}
.face{
  grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  min-height:300px;border-radius:var(--r);padding:36px 24px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:12px;position:relative;overflow:hidden;
  border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-lg);
}
.back{background:var(--blue-soft);transform:rotateY(180deg)}
.type{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big{font-size:clamp(28px,7vw,42px);font-weight:700;line-height:1.2;overflow-wrap:anywhere;letter-spacing:-.01em}
.big .art{font-size:.55em;vertical-align:middle}
.big.small{font-size:clamp(22px,5.5vw,32px)}
.sec{font-size:20px;font-weight:600}
.sec .art{font-size:.75em}
.formsbig{
  font-size:18px;font-weight:600;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 14px;
}
.exs{font-size:16px;font-style:italic;color:var(--muted);max-width:440px;line-height:1.45}
.tools{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:20px 0 8px}
.tip{text-align:center;color:var(--muted);margin:4px 0 12px;min-height:1.5em;font-size:14px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
.ans .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 12px;font-size:17px;line-height:1.2}
.ans small{font-weight:400;font-size:12px;color:inherit;opacity:.8}
.ans .again{border-color:var(--red);color:var(--red);background:#fff}
.ans .again:hover:not([disabled]){background:var(--red-soft);border-color:var(--red)}
.ans .good{background:var(--blue);border-color:var(--blue);color:#fff}
.ans .good:hover:not([disabled]){background:#1D4ED8;border-color:#1D4ED8}
.done{
  max-width:560px;margin:16px auto;text-align:center;background:#fff;
  border:1px solid var(--line);border-radius:var(--r);padding:32px 24px;box-shadow:var(--shadow);
}
.done h2{margin:0 0 8px;font-size:26px;font-weight:700}
.done p{color:var(--muted);margin:0 0 16px}
.missed{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0 20px}
.missed span{
  background:var(--red-soft);border:1px solid #FECACA;color:var(--red);
  border-radius:999px;padding:4px 12px;font-weight:500;font-size:14px;
}
.done .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* Verkehrsmittel */
body[data-tab="verkehr"] .chips{display:none}
.vh{margin:8px 0 4px;font-size:22px;font-weight:700}
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:14px 0}
.vgame{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:14px 18px;margin:0 0 14px;max-width:760px;box-shadow:var(--shadow);
}
.vprompt{font-size:clamp(20px,4.5vw,26px);font-weight:600;line-height:1.3;margin-bottom:10px}
.vrow{display:flex;flex-wrap:wrap;gap:8px}
.scene{
  overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);
  background:#E0F2FE;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow);
}
.scene-inner{position:relative;min-width:720px;aspect-ratio:3/2}
.scene-inner svg,.scene-inner img{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{
  position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;
  border:2px solid #fff;background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:17px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  box-shadow:0 2px 10px rgba(37,99,235,.4);animation:pulse 2.4s infinite;
}
.spot.seen{background:#fff;color:var(--blue);border-color:var(--blue);animation:none}
.spot[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);animation:none}
.spot:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.spot.shake{animation:shake .4s}
.spot.drag{cursor:grab}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}50%{box-shadow:0 0 0 12px rgba(37,99,235,0)}}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 7px),-50%)}75%{transform:translate(calc(-50% + 7px),-50%)}}
.small{font-size:13px;margin:8px 0 0;color:var(--muted)}
.vcard{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-top:16px;max-width:760px;box-shadow:var(--shadow-lg);
}
.vtop{display:flex;gap:12px;align-items:center}
.vword{font-size:24px;font-weight:700;line-height:1.2}
.vword .alt{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.vfact{margin:14px 0 0}
.vfact .lbl{font-weight:600;color:var(--blue);font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.vfact .ex{font-style:normal;color:var(--ink);font-size:16px;padding:4px 0 0;min-height:0}
.vsent{background:var(--panel);border-radius:10px;padding:12px 16px;margin-top:12px;border:1px solid var(--line)}
.vsent .q{font-size:13px;color:var(--muted);margin-bottom:2px}
.vsent .a{font-size:17px;font-weight:600}
.dat{color:var(--blue);font-weight:700;background:var(--blue-soft);border-radius:6px;padding:0 6px}
.vedit{margin-top:16px;padding:14px;border:1px dashed var(--line-strong);border-radius:10px;max-width:760px}
.vedit textarea{
  width:100%;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;
  border:1px solid var(--line-strong);border-radius:8px;padding:10px;margin-top:8px;
}
@media (prefers-reduced-motion:reduce){.spot{animation:none!important}}
.vcard{position:relative}
.vclose{
  display:none;position:absolute;top:6px;right:6px;width:40px;height:40px;
  border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--muted);border-radius:8px;
}
.vclose:hover{background:var(--panel);color:var(--ink)}
.vplace{display:none}
.vgame{position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
#verkehr.portrait .scene{overflow:hidden;max-width:560px;margin:0 auto}
#verkehr.portrait .scene-inner{min-width:0}
#verkehr.portrait .vscroll-hint{display:none}
@media (min-width:900px){
  #verkehr.portrait .vwrap{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px;align-items:start}
  #verkehr.portrait .vcard{position:sticky;top:16px;margin-top:0}
  #verkehr.gaming.portrait .vcard,#verkehr.gaming.portrait .vplace{top:150px}
  #verkehr.portrait .vcard[hidden]~.vplace{display:block;position:sticky;top:16px;padding:20px;border:1px dashed var(--line-strong);border-radius:12px;color:var(--muted);font-size:14px}
}
@media (max-width:899px){
  #verkehr.portrait .vcard{
    position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));
    margin:0;max-width:none;max-height:58vh;overflow:auto;z-index:40;
    padding-right:52px;box-shadow:0 10px 40px rgba(0,0,0,.2);
  }
  #verkehr.portrait .vclose{display:block}
  #verkehr.portrait.sheet{padding-bottom:46vh}
  #verkehr.portrait .vcard{max-height:44vh;padding:12px 48px 12px 16px}
  #verkehr.portrait .vword{font-size:20px}
  #verkehr.portrait .vword .alt{font-size:12px}
  #verkehr.portrait .vtop{gap:10px}
  #verkehr.portrait .vtop .say{width:36px;height:36px}
  #verkehr.portrait .vfact{margin-top:8px}
  #verkehr.portrait .vfact .ex{font-size:14px;line-height:1.4;min-height:0;padding:0}
  #verkehr.portrait #v-factru{font-size:12px!important}
  #verkehr.portrait .vsent{margin-top:8px;padding:8px 12px}
  #verkehr.portrait .vsent .a{font-size:15px}
}

/* Sprechen */
body[data-tab="sprechen"] .chips{display:none}
.psegs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.psegb{
  font:inherit;font-weight:500;font-size:14px;border:1px solid var(--line-strong);
  background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;min-height:38px;
  cursor:pointer;transition:all .15s;
}
.psegb:hover{border-color:var(--ink)}
.psegb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.sp-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:32px 24px 24px;max-width:600px;margin:16px 0;text-align:center;
  position:relative;overflow:hidden;box-shadow:var(--shadow-lg);
}
.sp-pat{font-size:clamp(22px,5vw,28px);font-weight:700;margin:6px 0 16px;line-height:1.25}
.sp-pat small{
  display:block;font-size:12px;font-weight:600;color:var(--muted);
  letter-spacing:.08em;margin-top:4px;text-transform:uppercase;
}
.sp-words{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
.sp-chip{
  border-radius:12px;padding:8px 18px;font-size:clamp(22px,5.5vw,32px);
  font-weight:700;border:1px solid var(--line);
}
.sp-chip.noun{background:var(--blue-soft);border-color:#BFDBFE}
.sp-chip.adj{background:var(--panel);border-color:var(--line-strong)}
.sp-plus{font-size:22px;font-weight:600;color:var(--muted)}
.sp-q{margin-top:16px;color:var(--muted);font-size:14px}
.sp-sol{
  margin-top:16px;font-size:clamp(18px,4.5vw,24px);font-weight:600;line-height:1.5;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
}
.sp-why{margin-top:12px;font-size:15px;text-align:left;color:var(--muted);line-height:1.5}
.g-der{color:#1E40AF}.g-die{color:#B91C1C}.g-das{color:#047857}
.sp-end{background:#FEF3C7;border-radius:5px;padding:0 4px;color:#92400E;font-weight:700}
.sp-ans{max-width:600px;margin:0}
.sp-tools{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin:8px 0 12px}
.sp-det{max-width:600px;margin:16px 0}
.sp-sum{
  font-weight:600;font-size:15px;cursor:pointer;min-height:40px;
  display:flex;align-items:center;color:var(--ink);padding:8px 0;
}
.sp-sum::marker{color:var(--muted)}
.sp-tab{border-collapse:collapse;width:100%;font-size:14px;background:#fff;margin-top:10px;border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.sp-tab th,.sp-tab td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.sp-tab th{background:var(--panel);font-weight:600}
.sp-box{
  max-width:600px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 20px;margin:16px 0;line-height:1.55;
}
.sp-box ol{margin:8px 0 0 20px;padding:0}
.sp-box .rus{color:var(--muted);font-size:14px;margin-top:4px}
footer{color:var(--muted);font-size:13px;padding-top:8px;padding-bottom:40px}

@media (max-width:640px){
  header,nav,.filters,main,footer{padding-left:18px;padding-right:18px}
  header{padding-top:calc(28px + env(safe-area-inset-top,0px))}
  h1{font-size:28px}
  .lead{font-size:15px}
  nav{padding-top:20px;gap:0;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px;width:calc(100% + 36px)}
  nav::-webkit-scrollbar{display:none}
  .stamp{padding:10px 12px;font-size:14px;white-space:nowrap}
  .stamp[aria-selected="true"]::after{left:12px;right:12px}
  .filters{padding-top:14px;flex-direction:column;align-items:stretch;gap:8px}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:2px 18px 8px;width:calc(100% + 36px);scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .cat{flex:none;padding:6px 12px;font-size:13px;min-height:36px}
  #voice{max-width:100%;width:100%}
  .face{min-height:240px;padding:28px 16px 16px;gap:10px}
  .opts{gap:8px 12px;margin:4px 0 12px}
